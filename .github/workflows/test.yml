name: Test
on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build image
        run: docker build -t test -f Containerfile .
      - name: Run image
        run: docker run -d --name clamav test
      - name: Verify
        run: |
          [ $(docker inspect clamav --format='{{.State.Running}}') = 'true' ]
      - name: Wait online
        run : |
          wait=60
          while ! docker exec clamav nc -z 0.0.0.0 3310; do
            wait=$((wait - 1))
            [ "$wait" -le 0 ] && exit 1
            sleep 1
          done
      - name: Test Eicar
        run: |
          docker exec clamav sh -c 'echo '\''X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*'\'' > /tmp/eicar.com'
          set +e
          docker exec clamav clamdscan --stream /tmp/eicar.com
          [ $? -eq 1 ]
      - name: Assert release-tag metadata safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path(".github/workflows/push.yml").read_text()
          version = re.search(r"^  CLAMAV_VERSION: (\S+)$", workflow, re.MULTILINE).group(1)
          tags_block = re.search(r"^          tags: \|\n((?:            .*\n)+)", workflow, re.MULTILINE).group(1)
          tag_specs = [line.strip() for line in tags_block.splitlines()]
          default_branch_expression = "$" + "{{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}"
          version_expression = "$" + "{{ env.CLAMAV_VERSION }}"
          gated_version_tag = f"type=raw,value={version_expression},enable={default_branch_expression}"
          ungated_version_tag = f"type=raw,value={version_expression}"
          assert gated_version_tag in tag_specs
          assert ungated_version_tag not in tag_specs

          def metadata_tags(ref):
              tags = set()
              for spec in tag_specs:
                  if spec == "type=ref,event=tag" and ref.startswith("refs/tags/"):
                      tags.add(ref.removeprefix("refs/tags/"))
                  if not spec.startswith("type=raw,value="):
                      continue
                  value, _, enable = spec.removeprefix("type=raw,value=").partition(",enable=")
                  value = value.replace(version_expression, version)
                  if not enable or enable == default_branch_expression:
                      if not enable or ref == "refs/heads/main":
                          tags.add(value)
              return tags

          release_tags = metadata_tags("refs/tags/v0.0.1")
          main_tags = metadata_tags("refs/heads/main")
          pull_request_tags = metadata_tags("refs/pull/1/merge")
          assert {"v0.0.1"} <= release_tags
          assert {version, "latest"}.isdisjoint(release_tags)
          assert {version, "latest"} <= main_tags
          assert {version, "latest"}.isdisjoint(pull_request_tags)
          assert {"latest"}.isdisjoint(pull_request_tags)
          PY
      - name: Validate Renovate extraction
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          config = json.loads(Path("renovate.json").read_text())
          manager = config["customManagers"][0]
          workflow = Path(".github/workflows/push.yml").read_text()
          containerfile = Path("Containerfile").read_text()
          renovate_comment = "# renovate: datasource=docker depName=clamav/clamav"
          version_pattern = r"CLAMAV_VERSION\s*[=:]\s*\"?(?P<version>[0-9][\w.-]*)\"?"
          image_pattern = r"^FROM (?P<depName>clamav/clamav):(?P<version>[^@\s]+)"

          assert manager["customType"] == "regex"
          assert manager["datasourceTemplate"] == "docker"
          assert manager["versioningTemplate"] == "semver"
          assert renovate_comment in workflow
          workflow_match = re.search(
              renovate_comment + r"\n\s*" + version_pattern, workflow
          )
           image_match = re.search(image_pattern, containerfile, re.MULTILINE)
           assert "  pull_request:" not in workflow
           assert workflow_match and image_match
          assert workflow_match.group("version") == image_match.group("version")
          assert all(
              re.search(pattern.replace("?<", "?P<"), workflow, re.MULTILINE)
              or re.search(pattern.replace("?<", "?P<"), containerfile, re.MULTILINE)
              for pattern in manager["matchStrings"]
          )
          PY
