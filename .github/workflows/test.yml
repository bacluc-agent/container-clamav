name: Test
on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build image
        run: docker build -t test -f Containerfile .
      - name: Run image
        run: docker run -d --name clamav test
      - name: Verify
        run: |
          [ $(docker inspect clamav --format='{{.State.Running}}') = 'true' ]
      - name: Wait online
        run : |
          wait=60
          while ! docker exec clamav nc -z 0.0.0.0 3310; do
            wait=$((wait - 1))
            [ "$wait" -le 0 ] && exit 1
            sleep 1
          done
      - name: Test Eicar
        run: |
          docker exec clamav sh -c 'echo '\''X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*'\'' > /tmp/eicar.com'
          set +e
          docker exec clamav clamdscan --stream /tmp/eicar.com
          [ $? -eq 1 ]
      - name: Assert release-tag metadata safety
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/push.yml").read_text()
          expression = "$" + "{{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}"
          default_branch = "enable=" + expression
          version_tag = "type=raw,value=" + "$" + "{{ env.CLAMAV_VERSION }}" + "," + default_branch + "\n"
          assert "flavor: latest=false" in workflow
          assert workflow.count(version_tag) == 1
          assert workflow.count("type=raw,value=latest," + default_branch) == 1
          assert "type=ref,event=tag" in workflow
          assert "type=raw,value=1.5.4" not in workflow
          release_ref = "refs/tags/v0.0.1"
          assert release_ref != "refs/heads/main"
          assert default_branch.endswith("default_branch) }}")
          PY
